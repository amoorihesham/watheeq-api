# Local development database only. Data stays on this machine, in a named volume.
# Tests do not use this file: they start their own database through Testcontainers.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: watheeq
      POSTGRES_PASSWORD: watheeq
      POSTGRES_DB: watheeq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - watheeq-pgdata:/var/lib/postgresql
    healthcheck:
      # -h forces TCP: during first-time init the image runs a temporary server on the Unix socket only,
      # so a socket check would report healthy before the real server accepts TCP connections.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U watheeq -d watheeq"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP server and inbox for verification emails (Phase 1 spec, P1.18). Inbox: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  # Local S3-compatible object storage for uploaded files (Phase 5.5 spec, P5.5.5). S3 API: http://localhost:8333
  # SeaweedFS rather than MinIO, whose community edition stopped shipping images and whose repository is archived.
  storage:
    image: chrislusf/seaweedfs:4.50
    command: server -filer -s3 -dir=/data
    environment:
      # Becomes the S3 admin identity; matches STORAGE_ACCESS_KEY and STORAGE_SECRET_KEY in .env.example.
      AWS_ACCESS_KEY_ID: watheeq
      AWS_SECRET_ACCESS_KEY: watheeq-local-secret
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - watheeq-s3data:/data
    healthcheck:
      # Any HTTP answer (an anonymous request gets 403) means the S3 API is up; curl fails only without a connection.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: creates the bucket the app and .env.example expect (a few seconds after startup), then exits.
  storage-init:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    # Idempotent, so `docker compose up` can run it again.
    command:
      - >-
        echo s3.bucket.list | weed shell -master=storage:9333 | grep -qw watheeq-files
        || echo "s3.bucket.create -name watheeq-files" | weed shell -master=storage:9333
    restart: "no"

volumes:
  watheeq-pgdata:
  watheeq-s3data:
